<section class="page">
  <div class="page-heading">
    <p>Manager dashboard</p>
    <h1>Team accountability</h1>
  </div>

  @if (workspace$ | async; as workspace) {
    <div class="dashboard-summary">
      <div>
        <strong>{{ workspace.managerCommitments.length }}</strong>
        <span>managed commitment{{ workspace.managerCommitments.length === 1 ? '' : 's' }}</span>
      </div>
    </div>

    <app-managed-commitment-list
      [commitments]="workspace.managerCommitments"
      title="Whose commitments you manage"
      emptyTitle="No managed commitments"
      emptyMessage="When someone assigns you as manager, their commitments will appear here."
    />
  } @else {
    <app-loading-state message="Loading managed commitments" />
  }
</section>

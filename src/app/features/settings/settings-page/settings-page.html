<section class="page">
  <div class="page-heading">
    <p>Settings</p>
    <h1>Account preferences</h1>
  </div>

  <p-card>
    <h2>Profile</h2>

    @if (errorMessage()) {
      <app-error-state
        title="Unable to save profile"
        [message]="errorMessage()!"
        [showAction]="false"
      />
    }

    @if (isSaving()) {
      <app-loading-state message="Saving profile" />
    }

    @if (currentProfile$ | async; as profile) {
      <app-profile-settings-form
        [displayName]="profile.displayName"
        [profileImageUrl]="profile.profileImageUrl"
        (submitted)="updateProfile($event)"
      />
    } @else {
      <app-loading-state message="Loading profile" />
    }
  </p-card>
</section>

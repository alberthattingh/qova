<section class="page">
  <div class="page-heading">
    <p>Review queue</p>
    <h1>Sponsor reviews</h1>
  </div>

  @if (queueState$ | async; as state) {
    @if (state.isLoading) {
    <app-loading-state message="Loading review queue" />
    } @else if (state.error) {
      <app-error-state
        title="Unable to load review queue"
        [message]="state.error"
        [showAction]="false"
      />
    } @else if (state.queue; as queue) {
      <div class="queue-summary">
        <p-tag [value]="status" severity="warn" />
        <span>
          {{ queue.actionRequiredCount }} item{{ queue.actionRequiredCount === 1 ? '' : 's' }}
          requiring sponsor action
        </span>
      </div>

      <app-review-queue-list [items]="queue.items" />
    }
  }
</section>

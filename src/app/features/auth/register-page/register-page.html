<main class="auth-page">
  <p-card>
    <h1>Create account</h1>
    <p>Start tracking commitments with Qova.</p>

    @if (errorMessage()) {
      <app-error-state
        title="Unable to register"
        [message]="errorMessage()!"
        [showAction]="false"
      />
    }

    @if (isSubmitting()) {
      <app-loading-state message="Creating account" />
    } @else {
      <form [formGroup]="form" (ngSubmit)="submit()">
        <label>
          <span>Email</span>
          <input pInputText type="email" formControlName="email" autocomplete="email" />
        </label>

        <label>
          <span>Password</span>
          <p-password formControlName="password" [toggleMask]="true" />
        </label>

        <p-button label="Create account" icon="pi pi-user-plus" type="submit" />
      </form>
    }

    <a [routerLink]="loginRoute">Already have an account?</a>
  </p-card>
</main>

<main class="auth-page">
  <p-card>
    <h1>Sign in</h1>
    <p>Access your commitments, check-ins, and reviews.</p>

    @if (errorMessage()) {
      <app-error-state
        title="Unable to sign in"
        [message]="errorMessage()!"
        [showAction]="false"
      />
    }

    @if (isSubmitting()) {
      <app-loading-state message="Signing in" />
    } @else {
      <app-login-form (submitted)="submit($event)" />
    }

    <a [routerLink]="registerRoute">Create an account</a>
  </p-card>
</main>

<main class="auth-page">
  <p-card>
    <h1>Sign in</h1>
    <p>Access your commitments, check-ins, and reviews.</p>

    @if (errorMessage()) {
      <app-error-state
        title="Unable to sign in"
        [message]="errorMessage()!"
        [showAction]="false"
      />
    }

    @if (isSubmitting()) {
      <app-loading-state message="Signing in" />
    } @else {
      <form [formGroup]="form" (ngSubmit)="submit()">
        <label>
          <span>Email</span>
          <input pInputText type="email" formControlName="email" autocomplete="email" />
        </label>

        <label>
          <span>Password</span>
          <p-password formControlName="password" [feedback]="false" [toggleMask]="true" />
        </label>

        <p-button label="Sign in" icon="pi pi-sign-in" type="submit" />
      </form>
    }

    <a [routerLink]="registerRoute">Create an account</a>
  </p-card>
</main>

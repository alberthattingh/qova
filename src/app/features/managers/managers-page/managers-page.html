<section class="page">
  <div class="page-heading">
    <p>Sponsors</p>
    <h1>Trusted sponsor relationships</h1>
  </div>

  <p-card>
    <h2>Invite a sponsor</h2>
    <app-manager-invite-form (submitted)="inviteManager($event)" />
  </p-card>

  @if (isWorking()) {
    <app-loading-state message="Updating sponsor relationships" />
  }

  @if (dashboard$ | async; as dashboard) {
    <section class="relationship-section">
      <h2>Pending invitations for you</h2>
      <app-manager-invitation-list
        [invitations]="dashboard.receivedInvitations"
        emptyTitle="No pending invitations"
        emptyMessage="Invitations from people asking you to sponsor them will appear here."
        mode="received"
        (accepted)="acceptInvitation($event)"
        (declined)="declineInvitation($event)"
      />
    </section>

    <p-divider />

    <section class="relationship-section">
      <h2>Invitations you sent</h2>
      <app-manager-invitation-list
        [invitations]="dashboard.sentInvitations"
        emptyTitle="No sent invitations"
        emptyMessage="Pending sponsor invitations you send will appear here."
        mode="sent"
        (cancelled)="cancelInvitation($event)"
      />
    </section>

    <p-divider />

    <section class="relationship-section">
      <h2>People sponsoring you</h2>
      <app-manager-card-list
        [relationships]="dashboard.managers"
        emptyTitle="No sponsors yet"
        emptyMessage="Invite a trusted person to help sponsor your commitments."
        mode="manager"
        (relationshipEnded)="removeManager($event)"
      />
    </section>

    <p-divider />

    <section class="relationship-section">
      <h2>People you sponsor</h2>
      <app-manager-card-list
        [relationships]="dashboard.managedUsers"
        emptyTitle="No sponsored users yet"
        emptyMessage="People who accept your sponsorship invitation will appear here."
        mode="managed-user"
        (relationshipEnded)="stopManaging($event)"
      />
    </section>
  } @else {
    <app-loading-state message="Loading sponsor relationships" />
  }
</section>

<div class="layout">
  <aside>
    <a class="brand" [routerLink]="ABSOLUTE_ROUTES.userDashboard">
      <span>Q</span>
      <strong>qova</strong>
    </a>

    <nav aria-label="Primary navigation">
      @for (item of navItems; track item.route) {
        <a [routerLink]="item.route" routerLinkActive="active">
          <i [class]="item.icon"></i>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>
  </aside>

  <section class="workspace">
    <header>
      @if (currentUser$ | async; as user) {
        <a class="dashboard-link" [routerLink]="dashboardRouteForUser(user.role)">
          <i class="pi pi-user"></i>
          <span>{{ user.displayName || user.email }}</span>
        </a>
        <p-tag [value]="user.role" />
      }

      <p-button label="Sign out" icon="pi pi-sign-out" severity="secondary" outlined (onClick)="signOut()" />
    </header>

    <main>
      <router-outlet />
    </main>
  </section>
</div>

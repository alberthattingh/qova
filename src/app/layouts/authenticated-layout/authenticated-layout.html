<div class="layout">
  <aside>
    <a class="brand" [routerLink]="ABSOLUTE_ROUTES.userDashboard">
      <span>Q</span>
      <strong>qova</strong>
    </a>

    <nav aria-label="Primary navigation">
      @for (item of navItems; track item.route) {
        <a [routerLink]="item.route" routerLinkActive="active">
          <i [class]="item.icon"></i>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>
  </aside>

  <section class="workspace">
    <header>
      @if (currentUser$ | async; as user) {
        <a class="dashboard-link" [routerLink]="ABSOLUTE_ROUTES.userDashboard">
          <img [src]="user.profileImageUrl" [alt]="user.displayName" />
          <span>{{ user.displayName }}</span>
        </a>
      }

      <p-button label="Sign out" icon="pi pi-sign-out" severity="secondary" outlined (onClick)="signOut()" />
    </header>

    <main>
      <router-outlet />

      @if (isRouteLoading$ | async) {
        <div class="route-loading">
          <app-loading-state message="Loading page" />
        </div>
      }
    </main>
  </section>
</div>
